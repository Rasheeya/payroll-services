<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - STACKLY</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">

    <style>
        .error-page-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            position: relative;
            overflow: hidden;
            padding: 2rem;
        }

        /* Abstract shapes for background animation */
        .shape {
            position: absolute;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.5;
            border-radius: 50%;
        }

        .shape-1 {
            width: 500px;
            height: 500px;
            background: var(--accent);
            top: -150px;
            left: -150px;
        }

        .shape-2 {
            width: 400px;
            height: 400px;
            background: var(--primary);
            bottom: -100px;
            right: -100px;
        }

        .shape-3 {
            width: 300px;
            height: 300px;
            background: #3498DB;
            top: 20%;
            right: 15%;
            opacity: 0.3;
        }

        .error-content {
            position: relative;
            z-index: 1;
            text-align: center;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 4rem 3rem;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(24, 43, 73, 0.08);
            max-width: 600px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .error-glitch {
            font-size: 8rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
            margin-bottom: 1rem;
            position: relative;
            display: inline-block;
            text-shadow: 4px 4px 0px rgba(24, 169, 153, 0.2);
        }

        .error-title {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .error-desc {
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .search-box {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2.5rem;
            position: relative;
        }

        .search-box input {
            flex: 1;
            padding: 1rem 1.5rem;
            border-radius: 50px;
            border: 1px solid rgba(24, 43, 73, 0.1);
            font-family: inherit;
            font-size: 1rem;
            background: white;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(24, 169, 153, 0.15);
        }

        .search-box button {
            background: var(--primary);
            color: white;
            border: none;
            width: 50px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .search-box button:hover {
            background: var(--accent);
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-custom {
            padding: 0.75rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
            font-size: 1rem;
        }

        .btn-back {
            border: 2px solid var(--primary);
            color: var(--primary);
            background: transparent;
        }

        .btn-back:hover {
            background: var(--primary);
            color: white;
        }

        .btn-home {
            background: var(--accent);
            color: white;
            border: 2px solid var(--accent);
        }

        .btn-home:hover {
            background: #159486;
            border-color: #159486;
            box-shadow: 0 10px 20px rgba(24, 169, 153, 0.2);
        }

        .brand-logo {
            position: absolute;
            top: 2rem;
            left: 2rem;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
            z-index: 2;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .brand-logo i {
            color: var(--accent);
        }

        @media (max-width: 768px) {
            .error-glitch {
                font-size: 6rem;
            }

            .error-title {
                font-size: 1.5rem;
            }

            .error-content {
                padding: 3rem 2rem;
            }

            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="error-page-container">
        <!-- Animated Background Shapes -->
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>

        <div class="error-content">
            <div class="error-glitch">404</div>
            <h1 class="error-title">Oops! Page not found.</h1>
            <p class="error-desc">The page you are looking for might have been removed, had its name changed, or is
                temporarily unavailable.</p>

            <div class="action-buttons">
                <!-- Functional Back Button -->
                <button onclick="if(history.length > 1 && document.referrer !== '') { window.history.back(); } else { window.location.href='index.html'; }" class="btn-custom btn-back">
                    <i class="fa-solid fa-arrow-left"></i> Go Back
                </button>
                <a href="index.html" class="btn-custom btn-home">
                    <i class="fa-solid fa-house"></i> Home
                </a>
            </div>

            <div style="margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid rgba(24, 43, 73, 0.1);">
            </div>
        </div>
    </div>

    <!-- GSAP for premium animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Background shapes floating animation
            gsap.to('.shape-1', {
                x: 'random(-100, 100)',
                y: 'random(-100, 100)',
                duration: 6,
                repeat: -1,
                yoyo: true,
                ease: 'sine.inOut'
            });

            gsap.to('.shape-2', {
                x: 'random(-100, 100)',
                y: 'random(-100, 100)',
                duration: 8,
                repeat: -1,
                yoyo: true,
                ease: 'sine.inOut'
            });

            gsap.to('.shape-3', {
                x: 'random(-80, 80)',
                y: 'random(-80, 80)',
                duration: 7,
                repeat: -1,
                yoyo: true,
                ease: 'sine.inOut'
            });

            // Content Entrance Animation
            gsap.from('.error-content', {
                y: 60,
                opacity: 0,
                duration: 1.2,
                ease: 'power3.out'
            });

            gsap.from('.error-glitch', {
                scale: 0.5,
                opacity: 0,
                duration: 1,
                delay: 0.3,
                ease: 'back.out(1.7)'
            });

            // Form interactive bounce
            const inputs = document.querySelectorAll('.search-box input');
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    gsap.to('.search-box', { scale: 1.02, duration: 0.3, ease: 'power2.out' });
                });
                input.addEventListener('blur', () => {
                    gsap.to('.search-box', { scale: 1, duration: 0.3, ease: 'power2.out' });
                });
            });

            // Hover bounce for buttons
            const buttons = document.querySelectorAll('.action-buttons .btn-custom');
            buttons.forEach(btn => {
                btn.addEventListener('mouseenter', () => {
                    gsap.to(btn, { y: -3, duration: 0.2, ease: 'power2.out' });
                });
                btn.addEventListener('mouseleave', () => {
                    gsap.to(btn, { y: 0, duration: 0.2, ease: 'power2.out' });
                });
            });
        });
    </script>
</body>

</html>
